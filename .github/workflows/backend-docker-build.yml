name: Build and Push Backend Image

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build.yml"
  workflow_dispatch:

env:
  BACKEND_IMAGE: mern-todo-backend
  K8S_NAMESPACE: mern-todo
  BACKEND_DEPLOYMENT: backend

jobs:
  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy-backend:
    name: Deploy backend to Minikube
    runs-on: [self-hosted, linux, x64, minikube]
    needs: build-backend

    steps:
      - name: Check Kubernetes context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy backend image by commit SHA
        run: |
          kubectl set image deployment/${{ env.BACKEND_DEPLOYMENT }} \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for backend rollout and rollback on failure
        run: |
          set +e
          kubectl rollout status deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          ROLLOUT_STATUS=$?
          set -e

          if [ $ROLLOUT_STATUS -ne 0 ]; then
            echo "Backend rollout failed. Rolling back to previous revision..."

            kubectl rollout undo deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

            echo "Waiting for rollback to complete..."
            kubectl rollout status deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

            echo "Rollback completed, but this workflow will fail because the new deployment was unsuccessful."
            exit 1
          fi

          echo "Backend rollout completed successfully."

      - name: Verify backend pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=backend -o wide
          kubectl get deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
