name: Build and Push Backend Image

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build.yml"
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: tnat8628
  BACKEND_IMAGE: mern-todo-backend
  K8S_NAMESPACE: mern-todo
  BACKEND_DEPLOYMENT: backend

jobs:
  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy-backend:
    name: Deploy backend to Minikube
    runs-on: [self-hosted, linux, x64, minikube]
    needs: build-backend

    steps:
      - name: Check Kubernetes context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Restart backend deployment
        run: |
          kubectl rollout restart deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/${{ env.BACKEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Verify backend pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=backend -o wide
