name: Build and Push Frontend Image

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: tnat8628
  FRONTEND_IMAGE: mern-todo-frontend
  K8S_NAMESPACE: mern-todo
  FRONTEND_DEPLOYMENT: frontend

jobs:
  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-frontend:
    name: Deploy frontend to Minikube
    runs-on: [self-hosted, linux, x64, minikube]
    needs: build-frontend

    steps:
      - name: Check Kubernetes context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Restart frontend deployment
        run: |
          kubectl rollout restart deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Verify frontend pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=frontend -o wide
