name: Build and Push Frontend Image

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"
  workflow_dispatch:

env:
  FRONTEND_IMAGE: mern-todo-frontend
  K8S_NAMESPACE: mern-todo
  FRONTEND_DEPLOYMENT: frontend

jobs:
  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Push frontend image after security scan
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-frontend:
    name: Deploy frontend to Minikube
    runs-on: [self-hosted, linux, x64, minikube]
    needs: build-frontend

    steps:
      - name: Check Kubernetes context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy frontend image by commit SHA
        run: |
          kubectl set image deployment/${{ env.FRONTEND_DEPLOYMENT }} \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for frontend rollout and rollback on failure
        run: |
          set +e
          kubectl rollout status deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          ROLLOUT_STATUS=$?
          set -e

          if [ $ROLLOUT_STATUS -ne 0 ]; then
            echo "Frontend rollout failed. Rolling back to previous revision..."

            kubectl rollout undo deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

            echo "Waiting for rollback to complete..."
            kubectl rollout status deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=180s

            echo "Rollback completed, but this workflow will fail because the new deployment was unsuccessful."
            exit 1
          fi

          echo "Frontend rollout completed successfully."

      - name: Verify frontend pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=frontend -o wide
          kubectl get deployment/${{ env.FRONTEND_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
